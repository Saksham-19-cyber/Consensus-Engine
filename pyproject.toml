[project]
name = "consensus-engine"
version = "0.1.0"
description = "Multi-agent negotiation under private information"
requires-python = ">=3.11"

[tool.poetry]
package-mode = false
dependencies = [
    "groq>=0.11.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "streamlit>=1.38.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scenarios*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
